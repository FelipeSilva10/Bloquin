[changelog]
header = """
# Changelog — Bloquin IDE\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%d/%m/%Y") }}
{% else %}\
## [Não lançado]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.breaking %}⚠️ **BREAKING:** {% endif %}{{ commit.message | upper_first }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/SEU_USUARIO/bloquin-ide/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}\n
"""
trim = true
footer = "<!-- gerado automaticamente pelo git-cliff -->"

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat",              group = "✨ Novas funcionalidades" },
  { message = "^fix",               group = "🐛 Correções de bugs" },
  { message = "^perf",              group = "⚡ Performance" },
  { message = "^refactor",          group = "♻️ Refatorações" },
  { message = "^docs",              group = "📚 Documentação" },
  { message = "^style",             group = "🎨 Interface e visual" },
  { message = "^test",              group = "🧪 Testes" },
  { message = "^chore|^ci|^build",  group = "🔧 Manutenção" },
  { message = "^revert",            group = "⏪ Revertidos" },
  # Ignora commits gerados automaticamente pelo CI
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge",              skip = true },
]
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
