name: Release — Build e Publicação

# ─────────────────────────────────────────────────────────────────────────────
# DISPARO: somente por tags semânticas.
#
#   Stable:  git tag v1.0.0        && git push origin v1.0.0
#   Beta:    git tag v1.0.0-beta.1 && git push origin v1.0.0-beta.1
#   RC:      git tag v1.0.0-rc.1   && git push origin v1.0.0-rc.1
#
# NUNCA dispara em push para branches — isso é papel do ci.yml.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

  # ─────────────────────────────────────────────────────────
  # NOME FIXO DO ASSET — NUNCA altere sem atualizar o site.
  # Garante o link permanente /releases/latest/download/...
  # ─────────────────────────────────────────────────────────
  ASSET_WINDOWS: "Bloquin-Setup-Windows.exe"

  # Versão do arduino-cli — altere conscientemente
  ARDUINO_CLI_VERSION: "1.4.1"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 0 — Metadados: interpreta a tag e define o canal de distribuição
  # ═══════════════════════════════════════════════════════════════════════════
  metadata:
    name: Metadados
    runs-on: ubuntu-22.04

    outputs:
      version:    ${{ steps.parse.outputs.version }}
      tag:        ${{ github.ref_name }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      is_stable:  ${{ steps.parse.outputs.is_stable }}
      canal:      ${{ steps.parse.outputs.canal }}

    steps:
      - name: Parsear tag e classificar canal
        id: parse
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$TAG" == *"-beta."* ]]; then
            echo "prerelease=true"  >> $GITHUB_OUTPUT
            echo "is_stable=false"  >> $GITHUB_OUTPUT
            echo "canal=Beta"       >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-rc."* ]]; then
            echo "prerelease=true"  >> $GITHUB_OUTPUT
            echo "is_stable=false"  >> $GITHUB_OUTPUT
            echo "canal=RC"         >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "is_stable=true"   >> $GITHUB_OUTPUT
            echo "canal=Stable"     >> $GITHUB_OUTPUT
          fi

      - name: Registrar canal no sumário
        run: |
          echo "## 🏷️ Tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Canal: ${{ steps.parse.outputs.canal }}" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Build Windows (.exe NSIS assinado)
  # ═══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Build — Windows (NSIS)
    needs: metadata
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Instalar dependências npm
        run: npm ci

      - name: Configurar ambiente do Supabase
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "::error::Os secrets VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY são obrigatórios para o build da release."
            exit 1
          fi

          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY"
          } > .env

          echo "Arquivo .env de build criado sem expor os valores nos logs."

      - name: Sincronizar versões com a tag
        shell: bash
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          node scripts/sync-version.mjs "$VERSION"
          grep -m1 '"version"' package.json
          grep -m1 '"version"' src-tauri/tauri.conf.json
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Baixar arduino-cli (Windows)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/ | Out-Null
          if (Test-Path src-tauri/resources/arduino-cli.exe) {
            Remove-Item -Force src-tauri/resources/arduino-cli.exe
          }
          $uri = "https://github.com/arduino/arduino-cli/releases/download/v${{ env.ARDUINO_CLI_VERSION }}/arduino-cli_${{ env.ARDUINO_CLI_VERSION }}_Windows_64bit.zip"
          Write-Host "Baixando arduino-cli ${{ env.ARDUINO_CLI_VERSION }}..."
          Invoke-WebRequest -Uri $uri -OutFile arduino-cli.zip
          Expand-Archive arduino-cli.zip -DestinationPath src-tauri/resources/ -Force
          Remove-Item arduino-cli.zip
          Write-Host "OK: $(Test-Path src-tauri/resources/arduino-cli.exe)"

      - name: Importar certificado PFX
        shell: powershell
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          $certPath  = "$env:RUNNER_TEMP\bloquin_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $securePass = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate `
            -FilePath $certPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePass
          Remove-Item $certPath
          Write-Host "Certificado importado."

      - name: Build Tauri (Windows — NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Assinar instalador NSIS
        shell: powershell
        run: |
          $signtool = Get-ChildItem `
            -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            Write-Error "signtool.exe não encontrado!"
            exit 1
          }
          Write-Host "Usando: $signtool"

          $installer = Get-ChildItem `
            -Path "src-tauri/target/release/bundle/nsis" `
            -Filter "*.exe" |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "Instalador NSIS não encontrado!"
            exit 1
          }
          Write-Host "Assinando: $($installer.FullName)"

          & $signtool sign `
            /n "Bloquin" `
            /fd SHA256 `
            /d "Bloquin IDE" `
            /du "https://github.com/${{ github.repository }}" `
            /t "http://timestamp.digicert.com" `
            $installer.FullName

          Write-Host "✅ Assinado: $($installer.FullName)"

      - name: Renomear instalador para nome fixo
        id: rename
        shell: powershell
        run: |
          $installer = Get-ChildItem `
            -Path "src-tauri/target/release/bundle/nsis" `
            -Filter "*.exe" |
            Select-Object -First 1

          $dest = Join-Path $env:RUNNER_TEMP $env:ASSET_WINDOWS
          Copy-Item $installer.FullName $dest
          $sizeMB = [Math]::Round((Get-Item $dest).Length / 1MB, 2)
          Write-Host "Asset final: $dest ($sizeMB MB)"
          echo "path=$dest" >> $env:GITHUB_OUTPUT

      - name: Upload artifact — Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.rename.outputs.path }}
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — Publicar GitHub Release
  # ═══════════════════════════════════════════════════════════════════════════
  publish-release:
    name: Publicar Release
    needs: [metadata, build-windows]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download — Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./dist

      - name: Verificar asset
        run: |
          echo "Assets prontos:"
          ls -lh ./dist/
          [ -f "dist/$ASSET_WINDOWS" ] || { echo "::error::$ASSET_WINDOWS ausente!"; exit 1; }

      # ─────────────────────────────────────────────────────
      # Changelog via git-cliff (binário direto, sem Docker)
      # ─────────────────────────────────────────────────────
      - name: Gerar notas da release
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
        continue-on-error: true

      - name: Garantir conteúdo das notas
        run: |
          if [ ! -s "RELEASE_NOTES.md" ]; then
            echo "## Bloquin IDE ${{ needs.metadata.outputs.version }}" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "Consulte o [histórico de commits](https://github.com/${{ github.repository }}/commits/${{ needs.metadata.outputs.tag }}) para detalhes das mudanças." >> RELEASE_NOTES.md
          fi

      - name: Montar corpo final da release
        run: |
          cd dist
          sha256sum "$ASSET_WINDOWS" > SHA256SUMS.txt
          cd ..

          REPO="${{ github.repository }}"

          cat >> RELEASE_NOTES.md << BODY

          ---

          ## 📥 Download e instalação

          | Plataforma | Arquivo |
          |---|---|
          | Windows 10/11 (64-bit) | \`$ASSET_WINDOWS\` |

          **Link permanente (última versão estável):**
          \`\`\`
          https://github.com/$REPO/releases/latest/download/$ASSET_WINDOWS
          \`\`\`

          ## ⚠️ Windows SmartScreen
          O Windows pode exibir um aviso na primeira instalação — isso é esperado para softwares independentes.
          O instalador é **assinado digitalmente**. Para instalar, clique em **"Mais informações" → "Executar assim mesmo"**.

          ## 🐛 Problemas ou dúvidas?
          Abra uma [issue](https://github.com/$REPO/issues) com a descrição do problema e sua versão do Windows.

          ## 🔐 Verificação de integridade (SHA256)
          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          BODY

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: >-
            Bloquin IDE v${{ needs.metadata.outputs.version }}
            ${{ needs.metadata.outputs.is_stable != 'true' && format('— {0}', needs.metadata.outputs.canal) || '' }}
          body_path: RELEASE_NOTES.md
          draft:      false
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.metadata.outputs.is_stable == 'true' }}
          files: |
            dist/${{ env.ASSET_WINDOWS }}
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 — Sumário final no GitHub Actions
  # ═══════════════════════════════════════════════════════════════════════════
  summary:
    name: Sumário
    needs: [metadata, publish-release]
    runs-on: ubuntu-22.04
    if: always()

    steps:
      - name: Escrever sumário
        run: |
          TAG="${{ needs.metadata.outputs.tag }}"
          CANAL="${{ needs.metadata.outputs.canal }}"
          REPO="${{ github.repository }}"
          STATUS="${{ needs.publish-release.result }}"

          if [ "$STATUS" = "success" ]; then
            echo "## ✅ Release publicada" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Falha na publicação" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Versão | \`$TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Canal  | $CANAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | [ver no GitHub](https://github.com/$REPO/releases/tag/$TAG) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Link permanente:**" >> $GITHUB_STEP_SUMMARY
          echo "- [Bloquin-Setup-Windows.exe](https://github.com/$REPO/releases/latest/download/Bloquin-Setup-Windows.exe)" >> $GITHUB_STEP_SUMMARY
