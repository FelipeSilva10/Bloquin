name: Release — Build e Publicação

# ─────────────────────────────────────────────────────────────────────────────
# DISPARO: somente por tags semânticas.
#
#   Stable:  git tag v1.0.0        && git push origin v1.0.0
#   Beta:    git tag v1.0.0-beta.1 && git push origin v1.0.0-beta.1
#   RC:      git tag v1.0.0-rc.1   && git push origin v1.0.0-rc.1
#
# NUNCA dispara em push para branches — isso é papel do ci.yml.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  # Builds recebem somente leitura; a publicação eleva a permissão no job
  # específico que cria a GitHub Release.
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

  ASSET_LINUX: "Bloquin-Linux-x86_64.AppImage"

  # Versão e hashes do arduino-cli — altere conscientemente e em conjunto.
  ARDUINO_CLI_VERSION: "1.4.1"
  ARDUINO_CLI_WINDOWS_SHA256: "44f506a29d134cb294898d5f729aea85e5498f5d81ff5fc63c549087c45a20a3"
  ARDUINO_CLI_LINUX_SHA256: "683cf2a6b8953e3d632e7e4512c36667839d2073349c4b6d312e4c67592359bd"
  ARDUINO_CLI_LINUX_BINARY_SHA256: "2e082731f7704672e9e0862e6d30af10fb93b2cd9e48f0e4e0076125ab10dae1"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 0 — Metadados: interpreta a tag e define o canal de distribuição
  # ═══════════════════════════════════════════════════════════════════════════
  metadata:
    name: Metadados
    runs-on: ubuntu-22.04

    outputs:
      version:    ${{ steps.parse.outputs.version }}
      tag:        ${{ github.ref_name }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      is_stable:  ${{ steps.parse.outputs.is_stable }}
      canal:      ${{ steps.parse.outputs.canal }}
      windows_asset: ${{ steps.parse.outputs.windows_asset }}

    steps:
      - name: Parsear tag e classificar canal
        id: parse
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "windows_asset=BloquinIDE_${VERSION}.exe" >> $GITHUB_OUTPUT

          if [[ "$TAG" == *"-beta."* ]]; then
            echo "prerelease=true"  >> $GITHUB_OUTPUT
            echo "is_stable=false"  >> $GITHUB_OUTPUT
            echo "canal=Beta"       >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-rc."* ]]; then
            echo "prerelease=true"  >> $GITHUB_OUTPUT
            echo "is_stable=false"  >> $GITHUB_OUTPUT
            echo "canal=RC"         >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "is_stable=true"   >> $GITHUB_OUTPUT
            echo "canal=Stable"     >> $GITHUB_OUTPUT
          fi

      - name: Registrar canal no sumário
        run: |
          echo "## 🏷️ Tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Canal: ${{ steps.parse.outputs.canal }}" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Build Windows (.exe NSIS assinado)
  # ═══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Build — Windows (NSIS)
    needs: metadata
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Instalar dependências npm
        run: npm ci

      - name: Configurar ambiente do Supabase
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Os secrets VITE_SUPABASE_URL e VITE_SUPABASE_PUBLISHABLE_KEY são obrigatórios para o build da release."
            exit 1
          fi

          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_PUBLISHABLE_KEY"
          } > .env

          echo "Arquivo .env de build criado sem expor os valores nos logs."

      - name: Sincronizar versões com a tag
        shell: bash
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          node scripts/sync-version.mjs "$VERSION"
          grep -m1 '"version"' package.json
          grep -m1 '"version"' src-tauri/tauri.conf.json
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Baixar arduino-cli (Windows)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/ | Out-Null
          if (Test-Path src-tauri/resources/arduino-cli.exe) {
            Remove-Item -Force src-tauri/resources/arduino-cli.exe
          }
          $uri = "https://github.com/arduino/arduino-cli/releases/download/v${{ env.ARDUINO_CLI_VERSION }}/arduino-cli_${{ env.ARDUINO_CLI_VERSION }}_Windows_64bit.zip"
          Write-Host "Baixando arduino-cli ${{ env.ARDUINO_CLI_VERSION }}..."
          Invoke-WebRequest -Uri $uri -OutFile arduino-cli.zip
          $actualHash = (Get-FileHash -Path arduino-cli.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:ARDUINO_CLI_WINDOWS_SHA256) {
            throw "SHA-256 inesperado para arduino-cli.zip: $actualHash"
          }
          Expand-Archive arduino-cli.zip -DestinationPath src-tauri/resources/ -Force
          Remove-Item arduino-cli.zip
          if (-not (Test-Path src-tauri/resources/arduino-cli.exe)) {
            throw "arduino-cli.exe não foi encontrado após a extração."
          }
          Write-Host "OK: arduino-cli.exe extraído."

      - name: Importar certificado PFX
        shell: powershell
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          $certPath  = "$env:RUNNER_TEMP\bloquin_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $securePass = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate `
            -FilePath $certPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePass
          Remove-Item $certPath
          Write-Host "Certificado importado."

      - name: Build Tauri (Windows — NSIS)
        run: npm run tauri:windows

      - name: Assinar instalador NSIS
        shell: powershell
        run: |
          $signtool = Get-ChildItem `
            -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            Write-Error "signtool.exe não encontrado!"
            exit 1
          }
          Write-Host "Usando: $signtool"

          $installer = Join-Path `
            "src-tauri/target/release/bundle/nsis" `
            "${{ needs.metadata.outputs.windows_asset }}"

          if (-not (Test-Path $installer)) {
            Write-Error "Instalador NSIS não encontrado: $installer"
            exit 1
          }
          Write-Host "Assinando: $installer"

          & $signtool sign `
            /n "Bloquin" `
            /fd SHA256 `
            /d "Bloquin IDE" `
            /du "https://github.com/${{ github.repository }}" `
            /t "http://timestamp.digicert.com" `
            $installer

          Write-Host "✅ Assinado: $installer"

      - name: Gerar assinatura do updater (Tauri)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $installer = Join-Path `
            "src-tauri/target/release/bundle/nsis" `
            "${{ needs.metadata.outputs.windows_asset }}"
          if (-not (Test-Path $installer)) {
            throw "Instalador NSIS não encontrado para assinar: $installer"
          }

          # Precisa rodar DEPOIS da assinatura Authenticode acima: ela
          # reescreve os bytes do .exe ao embutir o certificado, então uma
          # assinatura do updater gerada antes não bateria mais com o
          # arquivo que de fato será publicado e baixado pelos usuários.
          npx tauri signer sign `
            --private-key "$env:TAURI_SIGNING_PRIVATE_KEY" `
            --password "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" `
            $installer
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao gerar a assinatura do updater."
          }
          if (-not (Test-Path "$installer.sig")) {
            throw "Assinatura do updater não foi gerada: $installer.sig"
          }
          Write-Host "✅ Assinatura do updater gerada: $installer.sig"

      - name: Renomear instalador para nome fixo
        id: rename
        shell: powershell
        run: |
          $installer = Join-Path `
            "src-tauri/target/release/bundle/nsis" `
            "${{ needs.metadata.outputs.windows_asset }}"
          if (-not (Test-Path $installer)) {
            throw "Instalador NSIS não encontrado: $installer"
          }

          $dest = Join-Path $env:RUNNER_TEMP "${{ needs.metadata.outputs.windows_asset }}"
          Copy-Item $installer $dest
          $sizeMB = [Math]::Round((Get-Item $dest).Length / 1MB, 2)
          Write-Host "Asset final: $dest ($sizeMB MB)"
          echo "path=$dest" >> $env:GITHUB_OUTPUT

          $sigSource = "$installer.sig"
          if (-not (Test-Path $sigSource)) {
            throw "Assinatura do updater não encontrada: $sigSource"
          }
          $sigDest = "$dest.sig"
          Copy-Item $sigSource $sigDest
          echo "sig_path=$sigDest" >> $env:GITHUB_OUTPUT

      - name: Upload artifact — Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            ${{ steps.rename.outputs.path }}
            ${{ steps.rename.outputs.sig_path }}
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — Build Linux (AppImage)
  # ═══════════════════════════════════════════════════════════════════════════
  build-linux:
    name: Build — Linux (AppImage)
    needs: metadata
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Dependências do sistema (Tauri/AppImage)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libfuse2 \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Instalar dependências npm
        run: npm ci

      - name: Configurar ambiente do Supabase
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Os secrets VITE_SUPABASE_URL e VITE_SUPABASE_PUBLISHABLE_KEY são obrigatórios para o build da release."
            exit 1
          fi

          umask 077
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_PUBLISHABLE_KEY"
          } > .env

          echo "Arquivo .env de build criado sem expor os valores nos logs."

      - name: Sincronizar versões com a tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.metadata.outputs.version }}"
          node scripts/sync-version.mjs "$VERSION"
          grep -m1 '"version"' package.json
          grep -m1 '"version"' src-tauri/tauri.conf.json
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Baixar Arduino CLI verificado (Linux)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/
          archive="$RUNNER_TEMP/arduino-cli.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          printf '%s  %s\n' "$ARDUINO_CLI_LINUX_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory src-tauri/resources/ arduino-cli
          printf '%s  %s\n' "$ARDUINO_CLI_LINUX_BINARY_SHA256" "src-tauri/resources/arduino-cli" | sha256sum --check --strict
          chmod 0755 src-tauri/resources/arduino-cli
          src-tauri/resources/arduino-cli version

      - name: Build Tauri (Linux — AppImage)
        # Evita depender de um mount FUSE no runner ao executar linuxdeploy.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build -- --bundles appimage

      - name: Corrigir AppImage — remove libs Wayland empacotadas
        # WebKitGTK tenta inicializar EGL pela plataforma Wayland só porque as
        # libs libwayland-* estão presentes no bundle — mesmo em sessão X11 —
        # e trava antes de qualquer fallback: "Could not create default EGL
        # display: EGL_BAD_PARAMETER. Aborting...", matando o app assim que
        # abre em qualquer Wayland cujo Mesa deste runner ubuntu-22.04 não
        # negocie certo (reproduzido em Hyprland). GDK_BACKEND=x11 (que o
        # linuxdeploy-plugin-gtk já exporta) não evita isso, porque a falha é
        # do WebKit tentando Wayland diretamente, não da escolha de backend do
        # GTK. Remover as libs faz o WebKit cair pro caminho X11/GLX, que
        # funciona — confirmado ao vivo, e documentado em
        # https://github.com/tauri-apps/tauri/issues/11994.
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage" ]]; then
            echo "::error::AppImage não encontrada para corrigir."
            exit 1
          fi
          appimage_abs="$(realpath "$appimage")"

          workdir="$(mktemp -d)"
          pushd "$workdir" >/dev/null
          "$appimage_abs" --appimage-extract >/dev/null
          rm -f squashfs-root/usr/lib/*wayland*
          "$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage" --appdir=squashfs-root
          new_appimage="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$new_appimage" ]]; then
            echo "::error::Reempacotamento do AppImage falhou."
            exit 1
          fi
          mv "$new_appimage" "$appimage_abs"
          chmod 0755 "$appimage_abs"
          popd >/dev/null
          rm -rf "$workdir"

      - name: Preparar AppImage para publicação
        id: rename
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage" ]]; then
            echo "::error::AppImage não encontrada após o build."
            exit 1
          fi

          destination="$RUNNER_TEMP/$ASSET_LINUX"
          cp "$appimage" "$destination"
          chmod 0755 "$destination"
          sha256sum "$destination"
          printf 'path=%s\n' "$destination" >> "$GITHUB_OUTPUT"

      - name: Upload artifact — Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ${{ steps.rename.outputs.path }}
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 — Publicar GitHub Release
  # ═══════════════════════════════════════════════════════════════════════════
  publish-release:
    name: Publicar Release
    needs: [metadata, build-windows, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download — Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./dist

      - name: Download — Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: ./dist

      - name: Verificar assets
        run: |
          echo "Assets prontos:"
          ls -lh ./dist/
          [ -f "dist/${{ needs.metadata.outputs.windows_asset }}" ] || { echo "::error::${{ needs.metadata.outputs.windows_asset }} ausente!"; exit 1; }
          [ -f "dist/${{ needs.metadata.outputs.windows_asset }}.sig" ] || { echo "::error::${{ needs.metadata.outputs.windows_asset }}.sig ausente!"; exit 1; }
          [ -f "dist/$ASSET_LINUX" ] || { echo "::error::$ASSET_LINUX ausente!"; exit 1; }

      # ─────────────────────────────────────────────────────
      # Changelog via git-cliff (binário direto, sem Docker)
      # ─────────────────────────────────────────────────────
      - name: Gerar notas da release
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
        continue-on-error: true

      - name: Garantir conteúdo das notas
        run: |
          if [ ! -s "RELEASE_NOTES.md" ]; then
            echo "## Bloquin IDE ${{ needs.metadata.outputs.version }}" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "Consulte o [histórico de commits](https://github.com/${{ github.repository }}/commits/${{ needs.metadata.outputs.tag }}) para detalhes das mudanças." >> RELEASE_NOTES.md
          fi

      - name: Gerar manifesto do updater (latest.json)
        run: |
          node scripts/generate-updater-manifest.mjs \
            --version "${{ needs.metadata.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            --signature-file "dist/${{ needs.metadata.outputs.windows_asset }}.sig" \
            --windows-url "https://github.com/${{ github.repository }}/releases/download/${{ needs.metadata.outputs.tag }}/${{ needs.metadata.outputs.windows_asset }}" \
            --out dist/latest.json
          cat dist/latest.json

      - name: Montar corpo final da release
        run: |
          cd dist
          sha256sum "${{ needs.metadata.outputs.windows_asset }}" "${{ needs.metadata.outputs.windows_asset }}.sig" "$ASSET_LINUX" "latest.json" > SHA256SUMS.txt
          cd ..

          REPO="${{ github.repository }}"

          cat >> RELEASE_NOTES.md << BODY

          ---

          ## 📥 Download e instalação

          | Plataforma | Arquivo |
          |---|---|
          | Windows 10/11 (64-bit) | \`${{ needs.metadata.outputs.windows_asset }}\` |
          | Linux x86_64 | \`$ASSET_LINUX\` |

          **Última versão estável:**
          https://github.com/$REPO/releases/latest

          **Linux x86_64:**
          \`\`\`
          https://github.com/$REPO/releases/latest/download/$ASSET_LINUX
          \`\`\`

          ## ⚠️ Windows SmartScreen
          O Windows pode exibir um aviso na primeira instalação — isso é esperado para softwares independentes.
          O instalador é **assinado digitalmente**. Para instalar, clique em **"Mais informações" → "Executar assim mesmo"**.

          ## 🐛 Problemas ou dúvidas?
          Abra uma [issue](https://github.com/$REPO/issues) com a descrição do problema e sua versão do Windows.

          ## 🔐 Verificação de integridade (SHA256)
          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          BODY

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: >-
            Bloquin IDE v${{ needs.metadata.outputs.version }}
            ${{ needs.metadata.outputs.is_stable != 'true' && format('— {0}', needs.metadata.outputs.canal) || '' }}
          body_path: RELEASE_NOTES.md
          draft:      false
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.metadata.outputs.is_stable == 'true' }}
          files: |
            dist/${{ needs.metadata.outputs.windows_asset }}
            dist/${{ needs.metadata.outputs.windows_asset }}.sig
            dist/${{ env.ASSET_LINUX }}
            dist/latest.json
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4 — Sumário final no GitHub Actions
  # ═══════════════════════════════════════════════════════════════════════════
  summary:
    name: Sumário
    needs: [metadata, publish-release]
    runs-on: ubuntu-22.04
    if: always()

    steps:
      - name: Escrever sumário
        run: |
          TAG="${{ needs.metadata.outputs.tag }}"
          CANAL="${{ needs.metadata.outputs.canal }}"
          REPO="${{ github.repository }}"
          STATUS="${{ needs.publish-release.result }}"

          if [ "$STATUS" = "success" ]; then
            echo "## ✅ Release publicada" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Falha na publicação" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Versão | \`$TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Canal  | $CANAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | [ver no GitHub](https://github.com/$REPO/releases/tag/$TAG) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Link permanente:**" >> $GITHUB_STEP_SUMMARY
          echo "- [${{ needs.metadata.outputs.windows_asset }}](https://github.com/$REPO/releases/tag/$TAG)" >> $GITHUB_STEP_SUMMARY
          echo "- [Bloquin-Linux-x86_64.AppImage](https://github.com/$REPO/releases/latest/download/Bloquin-Linux-x86_64.AppImage)" >> $GITHUB_STEP_SUMMARY
