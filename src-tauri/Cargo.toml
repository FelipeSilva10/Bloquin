[package]
name = "bloquin"
version = "1.1.0"
description = "Ambiente visual de programação para Arduino e ESP32 voltado para o ensino."
authors = ["Felipe da Conceição Silva"]
license = "MIT"
repository = "https://github.com/FelipeSilva10/Bloquin"
edition = "2021"

[lib]
name = "bloquin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = ["webview-data-url"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
serialport        = "4.3.0"
urlencoding       = "2.1"
